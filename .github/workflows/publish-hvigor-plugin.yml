name: Publish hvigor-plugin

# Publishes ONLY @flashcatcloud/hvigor-plugin to npm. Separate from the OHPM SDK
# release (which triggers on the `publish` branch) — use a dedicated tag so the
# two never collide:
#   git tag hvigor-plugin-v0.1.0 && git push origin hvigor-plugin-v0.1.0
on:
  push:
    tags:
      - 'hvigor-plugin-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + test + npm pack only; skip npm publish'
        type: boolean
        default: true
      confirm_publish:
        description: 'Type "yes" to publish to npm when dry_run is false'
        required: true
        default: 'no'

permissions:
  contents: read

jobs:
  publish:
    name: Publish hvigor-plugin to npm
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: hvigor-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publish ref
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CONFIRM_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "publish" ]]; then
              echo "Manual publish must run from the publish branch. Current ref: ${GITHUB_REF_NAME}"
              exit 1
            fi

            if [[ "${DRY_RUN}" != "true" && "${CONFIRM_PUBLISH}" != "yes" ]]; then
              echo "Manual npm publish requires confirm_publish=yes when dry_run is false."
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch origin publish:refs/remotes/origin/publish
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/publish; then
              echo "Tag publish must point to a commit already contained in the publish branch."
              exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#hvigor-plugin-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match hvigor-plugin/package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Publishing @flashcatcloud/hvigor-plugin@$PKG_VERSION"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Pack (dry-run preview)
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Mirrors the notification jobs in publish-ohpm.yml. ignoreError keeps a broken
  # webhook from marking a release that already reached npm as failed.
  notify-success:
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Prepare notification
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "PUBLISH_MODE=Dry run" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_MODE=Publish" >> "$GITHUB_ENV"
          fi

          # On a tag the version is exact: the publish job fails unless the tag
          # matches hvigor-plugin/package.json.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "PACKAGE_LIST=@flashcatcloud/hvigor-plugin@${GITHUB_REF_NAME#hvigor-plugin-v}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_LIST=@flashcatcloud/hvigor-plugin" >> "$GITHUB_ENV"
          fi

      - name: Notify DingTalk on success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-harmony hvigor-plugin npm 发布通知",
                "text": "### ✅ hvigor-plugin npm 发布成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📦 类型: ${{ env.PUBLISH_MODE }}\n\n 📚 包名: ${{ env.PACKAGE_LIST }}\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify secondary DingTalk group on success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
          secret: ${{ secrets.DING_TALK_SECRET_2 }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-harmony hvigor-plugin npm 发布通知",
                "text": "### ✅ hvigor-plugin npm 发布成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📦 类型: ${{ env.PUBLISH_MODE }}\n\n 📚 包名: ${{ env.PACKAGE_LIST }}\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

  notify-failure:
    needs: publish
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Prepare notification
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "PUBLISH_MODE=Dry run" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_MODE=Publish" >> "$GITHUB_ENV"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "PACKAGE_LIST=@flashcatcloud/hvigor-plugin@${GITHUB_REF_NAME#hvigor-plugin-v}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_LIST=@flashcatcloud/hvigor-plugin" >> "$GITHUB_ENV"
          fi

      - name: Notify DingTalk on failure
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-harmony hvigor-plugin npm 发布通知",
                "text": "### ❌ hvigor-plugin npm 发布失败\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📦 类型: ${{ env.PUBLISH_MODE }}\n\n 📚 包名: ${{ env.PACKAGE_LIST }}\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
