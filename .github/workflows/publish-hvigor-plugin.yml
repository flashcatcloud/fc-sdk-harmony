name: Publish hvigor-plugin

# Publishes ONLY @flashcatcloud/hvigor-plugin to npm. Separate from the OHPM SDK
# release (which triggers on the `publish` branch) — use a dedicated tag so the
# two never collide:
#   git tag hvigor-plugin-v0.1.0 && git push origin hvigor-plugin-v0.1.0
on:
  push:
    tags:
      - 'hvigor-plugin-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + test + npm pack only; skip npm publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish hvigor-plugin to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hvigor-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#hvigor-plugin-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match hvigor-plugin/package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Publishing @flashcatcloud/hvigor-plugin@$PKG_VERSION"

      - run: npm install

      - run: npm run build

      - run: npm test

      - name: Pack (dry-run preview)
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
