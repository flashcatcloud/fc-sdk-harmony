name: Publish OHPM

on:
  push:
    tags:
      - 'harmony-sdk-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and prepublish only; skip ohpm publish"
        required: false
        default: true
        type: boolean
      confirm_publish:
        description: 'Type "yes" to publish packages to ohpm'
        required: true
        default: "no"

concurrency:
  group: publish-ohpm-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level so the notification jobs describe the same set the publish job
# actually handled — the list used to be written out separately in four places
# and went stale the first time a package was added.
env:
  HARMONY_MODULES: "flashcat_core flashcat_rum flashcat_crash flashcat_trace flashcat_axios"

jobs:
  publish-ohpm:
    name: Publish Harmony SDK packages to OHPM
    runs-on: [self-hosted, macOS, harmony]
    environment: Production
    permissions:
      contents: read

    env:
      OHPM_PUBLISH_REGISTRY: https://ohpm.openharmony.cn/ohpm/
      HARMONY_COMMAND_LINE_TOOLS_HOME: ${{ vars.HARMONY_COMMAND_LINE_TOOLS_HOME }}
      DEVECO_SDK_HOME: ${{ vars.DEVECO_SDK_HOME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publish ref
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CONFIRM_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "publish" ]]; then
              echo "Manual publish must run from the publish branch. Current ref: ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [[ "${DRY_RUN}" != "true" && "${CONFIRM_PUBLISH}" != "yes" ]]; then
              echo "Manual publish requires confirm_publish=yes when dry_run is false."
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#harmony-sdk-v}"
            PKG_VERSION="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' flashcat-core/oh-package.json5 | head -1)"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "Tag version (${TAG_VERSION}) does not match the SDK package version (${PKG_VERSION})."
              exit 1
            fi
            git fetch origin publish:refs/remotes/origin/publish
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/publish; then
              echo "Tag publish must point to a commit already contained in the publish branch."
              exit 1
            fi
            echo "Publishing HarmonyOS SDK ${PKG_VERSION}"
          fi

      - name: Configure Harmony command-line tools
        run: |
          set -euo pipefail

          COMMAND_LINE_TOOLS_HOME="${HARMONY_COMMAND_LINE_TOOLS_HOME:-$HOME/Downloads/command-line-tools}"
          DEVECO_HOME="${DEVECO_SDK_HOME:-/Applications/DevEco-Studio.app/Contents/sdk}"

          test -d "$COMMAND_LINE_TOOLS_HOME" || {
            echo "Harmony command-line tools not found: $COMMAND_LINE_TOOLS_HOME"
            echo "Set repository/org variable HARMONY_COMMAND_LINE_TOOLS_HOME or install the tools on the self-hosted runner."
            exit 1
          }
          test -f "$COMMAND_LINE_TOOLS_HOME/hvigor/bin/hvigorw.js" || {
            echo "hvigorw.js not found under $COMMAND_LINE_TOOLS_HOME/hvigor/bin"
            exit 1
          }
          test -d "$DEVECO_HOME" || {
            echo "DevEco SDK not found: $DEVECO_HOME"
            echo "Set repository/org variable DEVECO_SDK_HOME or install DevEco Studio SDK on the self-hosted runner."
            exit 1
          }

          {
            echo "$COMMAND_LINE_TOOLS_HOME/bin"
            echo "$COMMAND_LINE_TOOLS_HOME/ohpm/bin"
            echo "$DEVECO_HOME/default/openharmony/toolchains"
          } >> "$GITHUB_PATH"

          {
            echo "COMMAND_LINE_TOOLS_HOME=$COMMAND_LINE_TOOLS_HOME"
            echo "DEVECO_SDK_HOME=$DEVECO_HOME"
          } >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          set -euo pipefail
          ohpm --version
          node "$COMMAND_LINE_TOOLS_HOME/hvigor/bin/hvigorw.js" --version

      - name: Install ohpm dependencies
        run: |
          set -euo pipefail
          ohpm config set registry "$OHPM_PUBLISH_REGISTRY"
          ohpm config set publish_registry "$OHPM_PUBLISH_REGISTRY"
          ohpm install

      - name: Build HAR packages
        run: |
          set -euo pipefail
          for module in $HARMONY_MODULES; do
            node "$COMMAND_LINE_TOOLS_HOME/hvigor/bin/hvigorw.js" assembleHar \
              --mode module \
              -p "module=${module}@default" \
              -p product=default \
              --no-daemon
          done

      - name: Verify package manifests
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const packages = [
            ['flashcat-core/build/default/outputs/default/flashcat_core.har', '@flashcatcloud/core'],
            ['flashcat-rum/build/default/outputs/default/flashcat_rum.har', '@flashcatcloud/rum'],
            ['flashcat-crash/build/default/outputs/default/flashcat_crash.har', '@flashcatcloud/crash'],
            ['flashcat-trace/build/default/outputs/default/flashcat_trace.har', '@flashcatcloud/trace'],
          ];

          for (const [har, expectedName] of packages) {
            const manifest = execFileSync('tar', ['-xOzf', har, 'package/oh-package.json5'], { encoding: 'utf8' });
            const parsed = JSON.parse(manifest);
            if (parsed.name !== expectedName) {
              throw new Error(`${har} package name mismatch: expected ${expectedName}, got ${parsed.name}`);
            }
            console.log(`${parsed.name}@${parsed.version}`);
          }
          NODE

      - name: Prepublish check
        run: |
          set -euo pipefail
          ohpm prepublish flashcat-core/build/default/outputs/default/flashcat_core.har
          ohpm prepublish flashcat-rum/build/default/outputs/default/flashcat_rum.har
          ohpm prepublish flashcat-crash/build/default/outputs/default/flashcat_crash.har
          ohpm prepublish flashcat-trace/build/default/outputs/default/flashcat_trace.har

      - name: Upload HAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmony-ohpm-har
          path: |
            flashcat-core/build/default/outputs/default/flashcat_core.har
            flashcat-rum/build/default/outputs/default/flashcat_rum.har
            flashcat-crash/build/default/outputs/default/flashcat_crash.har
            flashcat-trace/build/default/outputs/default/flashcat_trace.har
          if-no-files-found: error

      - name: Configure ohpm publish credentials
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
          OHPM_PRIVATE_KEY: ${{ secrets.OHPM_PRIVATE_KEY }}
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${OHPM_PUBLISH_ID}" || -z "${OHPM_PRIVATE_KEY}" || -z "${OHPM_KEY_PASSPHRASE}" ]]; then
            echo "Missing OHPM_PUBLISH_ID, OHPM_PRIVATE_KEY or OHPM_KEY_PASSPHRASE secrets."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/ohpm_publish_key"
          printf '%s\n' "$OHPM_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # ohpm requires a passphrase-protected key (else 00609007) AND the
          # passphrase stored *encrypted* in .ohpmrc (plaintext -> 00602020).
          # Encryption is done by an auto-generated "crypto component" under
          # crypto_path via the interactive-only `ohpm config encrypt`: it rejects
          # piped input (setRawMode) and discards any input chunk containing a
          # control char, so we drive it through a PTY with expect and send the
          # password and the Enter as *separate* writes. encrypt + publish share
          # the same crypto_path so the value round-trips at publish time.
          CRYPTO_PATH="$RUNNER_TEMP/ohpm-crypto"
          rm -rf "$CRYPTO_PATH"; mkdir -p "$CRYPTO_PATH"

          ENC_PASS="$(CRYPTO_PATH="$CRYPTO_PATH" expect -c '
            log_user 0
            set timeout 60
            spawn ohpm config encrypt --crypto_path $env(CRYPTO_PATH)
            expect -re "to be encrypted:"
            send -- $env(OHPM_KEY_PASSPHRASE)
            after 300
            send -- "\r"
            log_user 1
            expect eof
          ' | sed -E 's/\x1b\[[0-9;]*m//g' | tr -d '\r' | grep -oE 'security:[0-9]+:[0-9A-Fa-f]+:[0-9A-Fa-f]+' | head -1 || true)"

          if [[ -z "${ENC_PASS}" ]]; then
            echo "Failed to encrypt the ohpm key passphrase via 'ohpm config encrypt'."
            exit 1
          fi

          ohpm config set publish_registry "$OHPM_PUBLISH_REGISTRY"
          ohpm config set publish_id "$OHPM_PUBLISH_ID"
          ohpm config set key_path "$KEY_PATH"
          ohpm config set crypto_path "$CRYPTO_PATH"
          ohpm config set key_passphrase "$ENC_PASS"

      - name: Publish packages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          for module in $HARMONY_MODULES; do
            dir="${module//_/-}"
            har="${dir}/build/default/outputs/default/${module}.har"
            echo "==> publishing ${har}"
            if output=$(ohpm publish "$har" --publish_registry "$OHPM_PUBLISH_REGISTRY" 2>&1); then
              echo "$output"
              continue
            fi
            echo "$output"
            # Re-running a release, or catching up a package the previous run
            # missed, re-submits versions the registry already holds. That is
            # not a failure of this run; anything else is.
            if echo "$output" | grep -qiE "already (exist|publish)"; then
              echo "::warning::${module}: this version is already on the registry, skipping"
              continue
            fi
            exit 1
          done

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## OHPM publish workflow"
            echo ""
            echo "- Ref: ${GITHUB_REF}"
            echo "- Actor: ${GITHUB_ACTOR}"
            echo "- Packages:"
            for module in $HARMONY_MODULES; do
              echo "  - @flashcatcloud/${module#flashcat_}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  notify-success:
    needs: publish-ohpm
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Prepare notification
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "PUBLISH_MODE=Dry run" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_MODE=Publish" >> "$GITHUB_ENV"
          fi
          packages=""
          for module in $HARMONY_MODULES; do
            packages="${packages:+${packages}, }@flashcatcloud/${module#flashcat_}"
          done
          echo "PACKAGE_LIST=${packages}" >> "$GITHUB_ENV"

      - name: Notify DingTalk on success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-harmony OHPM 发布通知",
                "text": "### ✅ fc-sdk-harmony OHPM 流程成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📦 类型: ${{ env.PUBLISH_MODE }}\n\n 📚 包名: ${{ env.PACKAGE_LIST }}\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify secondary DingTalk group on success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
          secret: ${{ secrets.DING_TALK_SECRET_2 }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-harmony OHPM 发布通知",
                "text": "### ✅ fc-sdk-harmony OHPM 流程成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📦 类型: ${{ env.PUBLISH_MODE }}\n\n 📚 包名: ${{ env.PACKAGE_LIST }}\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

  notify-failure:
    needs: publish-ohpm
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Prepare notification
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "PUBLISH_MODE=Dry run" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_MODE=Publish" >> "$GITHUB_ENV"
          fi
          packages=""
          for module in $HARMONY_MODULES; do
            packages="${packages:+${packages}, }@flashcatcloud/${module#flashcat_}"
          done
          echo "PACKAGE_LIST=${packages}" >> "$GITHUB_ENV"

      - name: Notify DingTalk on failure
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-harmony OHPM 发布通知",
                "text": "### ❌ fc-sdk-harmony OHPM 流程失败\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📦 类型: ${{ env.PUBLISH_MODE }}\n\n 📚 包名: ${{ env.PACKAGE_LIST }}\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
